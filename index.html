<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFIR Foundations & Techniques | Certificate</title>
<style>
body{margin:0;background:#f4f6f8;color:#172033;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:48px 20px}
.card{background:#fff;border:1px solid #e2e6eb;border-radius:18px;padding:36px;box-shadow:0 10px 35px rgba(0,0,0,.07)}
h1{margin:0 0 8px;font-size:30px} .sub{color:#596579;margin:0 0 28px;font-size:16px}
.meta{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:28px}
.meta div{min-width:180px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7a8494}.value{margin-top:5px;font-weight:600}
.cert{width:100%;height:auto;display:block;border:1px solid #ddd;border-radius:8px}
.note{text-align:center;color:#697386;font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>DFIR Foundations and Techniques</h1>
<p class="sub">Professional Skills and Readiness — Certificate of Completion</p>
<div class="meta">
<div><div class="label">Recipient</div><div class="value">Pius Wanjiru</div></div>
<div><div class="label">Issuing organization</div><div class="value">Blue Cape Security</div></div>
</div>
<img class="cert" src="certificate.png" alt="DFIR Foundations and Techniques certificate">
<p class="note">Certificate displayed as issued by Blue Cape Security.</p>
</div>
</div>
